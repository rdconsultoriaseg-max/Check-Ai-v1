<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Credenciais atualizadas do teu projeto check-ai-9303f
    const firebaseConfig = {
        apiKey: "AIzaSyBkVb8zenJDjsPSFRCiEmcsOHYhKdquT7M",
        authDomain: "check-ai-9303f.firebaseapp.com",
        projectId: "check-ai-9303f",
        storageBucket: "check-ai-9303f.firebasestorage.app",
        messagingSenderId: "732538707024",
        appId: "1:732538707024:web:d467b1246c7dcb16030555"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // FUNÇÃO PARA SALVAR USUÁRIO
    document.getElementById('btnSalvarUser').onclick = async () => {
        const nome = document.getElementById('nomeUser').value;
        const login = document.getElementById('emailUser').value;
        const senha = document.getElementById('senhaUser').value;
        const tipo = document.getElementById('tipoUser').value;

        if(!nome || !login || !senha) { alert("Por favor, preencha todos os campos."); return; }

        try {
            console.log("Tentando salvar..."); // Isto ajuda a ver no console
            await addDoc(collection(db, "usuarios"), { nome, login, senha, tipo });
            alert("Sucesso! Usuário cadastrado.");
            location.reload();
        } catch (e) { 
            console.error("Erro detalhado:", e);
            alert("Erro ao salvar: " + e.message); 
        }
    };
</script>
